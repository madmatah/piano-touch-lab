name: Build and Deploy demo to Netlify
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  # The last step posts the address of the deploy on the commit, as a status.
  statuses: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: demo
    env:
      is_live_deploy: ${{ github.ref == 'refs/heads/main' }}
      APP_ENV: demo
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the demo
        run: bun run build

      - name: Install Netlify CLI
        run: bun install -g netlify-cli@27.10.2

      - name: Deploy to Netlify
        uses: jsmrcaga/action-netlify-deploy@ae36ac1b3d1ad3646eecb5631977e7314d3a6a2f # v2.4.0
        with:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_DEPLOY_TO_PROD: ${{ env.is_live_deploy == 'true' }}
          build_directory: dist
          # The action runs these two commands with the Netlify token in their
          # environment, and an empty one falls back to npm: the install and the
          # build run in the steps above instead, where the token is not.
          install_command: 'true'
          build_command: 'true'
        timeout-minutes: 3

      - name: Run the action
        uses: guibranco/github-status-action-v2@77639353504055053524efa7a3719aaf0b731ce9 # v1.2.4
        with:
          authToken: ${{secrets.GITHUB_TOKEN}}
          context: ${{ env.is_live_deploy == 'true' && 'Netlify live URL' || 'Netlify preview URL' }}
          state: success
          target_url: ${{ env.is_live_deploy == 'true' && env.NETLIFY_LIVE_URL || env.NETLIFY_PREVIEW_URL }}
          sha: ${{github.event.pull_request.head.sha || github.sha}}
